<svg xmlns="http://www.w3.org/2000/svg" width="900" height="349" viewBox="0 0 900 349" role="img" aria-label="Claude Code — /grav-cms:grav-cms-setup (illustrative mockup)">
<rect width="900" height="349" rx="12" fill="#18181b"/>
<rect width="900" height="34" rx="12" fill="#27272a"/><rect y="22" width="900" height="12" fill="#27272a"/>
<circle cx="22" cy="17" r="6" fill="#f87171"/><circle cx="42" cy="17" r="6" fill="#facc15"/><circle cx="62" cy="17" r="6" fill="#4ade80"/>
<text x="450" y="22" text-anchor="middle" fill="#a1a1aa" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12.5">Claude Code — /grav-cms:grav-cms-setup</text>
<text x="886" y="22" text-anchor="end" fill="#52525b" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="11">illustrative mockup</text>
<g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="13">

<text x="22" y="52" xml:space="preserve"><tspan fill="#c4b5fd" font-weight="700">&gt; </tspan><tspan fill="#fafafa">/grav-cms:grav-cms-setup add blog.example.com</tspan></text>

<text x="22" y="94" xml:space="preserve"><tspan fill="#4ade80">● </tspan><tspan fill="#fafafa" font-weight="700">Bash</tspan><tspan fill="#71717a">  node …/scripts/grav-instances.mjs add --url blog.example.com \</tspan></text>
<text x="22" y="115" xml:space="preserve"><tspan fill="#71717a">                --key blog --label "Company Blog"</tspan></text>
<text x="22" y="136" xml:space="preserve"><tspan fill="#71717a">  ⎿ </tspan><tspan fill="#d4d4d8">{ "ok": true, "action": "added",</tspan></text>
<text x="22" y="157" xml:space="preserve"><tspan fill="#d4d4d8">      "instance": { "key": "</tspan><tspan fill="#facc15">grav-blog</tspan><tspan fill="#d4d4d8">", "url": "https://blog.example.com/mcp",</tspan></text>
<text x="22" y="178" xml:space="preserve"><tspan fill="#d4d4d8">                    "toolPrefix": "mcp__grav-blog__" } }</tspan></text>

<text x="22" y="220" xml:space="preserve"><tspan fill="#4ade80">● </tspan><tspan fill="#fafafa" font-weight="700">Bash</tspan><tspan fill="#71717a">  claude mcp add --transport http --scope user grav-blog \</tspan></text>
<text x="22" y="241" xml:space="preserve"><tspan fill="#71717a">                https://blog.example.com/mcp</tspan></text>
<text x="22" y="262" xml:space="preserve"><tspan fill="#71717a">  ⎿ </tspan><tspan fill="#d4d4d8">Added HTTP MCP server grav-blog with URL: https://blog.example.com/mcp to user config</tspan></text>

<text x="22" y="304" xml:space="preserve"><tspan fill="#c4b5fd">● </tspan><tspan fill="#d4d4d8">Registered "Company Blog". Next: reload, then run </tspan><tspan fill="#67e8f9">/mcp</tspan><tspan fill="#d4d4d8"> → grav-blog → Authenticate.</tspan></text>
</g>
</svg>
