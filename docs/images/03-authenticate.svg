<text x="22" y="52" xml:space="preserve"><tspan fill="#4ade80" font-weight="700">$ </tspan><tspan fill="#fafafa">claude mcp list</tspan></text>
<text x="22" y="73" xml:space="preserve"><tspan fill="#d4d4d8">  grav-blog: https://blog.example.com/mcp (HTTP) - </tspan><tspan fill="#facc15">! Needs authentication</tspan></text>

<text x="22" y="115" xml:space="preserve"><tspan fill="#c4b5fd" font-weight="700">&gt; </tspan><tspan fill="#fafafa">/mcp</tspan></text>
