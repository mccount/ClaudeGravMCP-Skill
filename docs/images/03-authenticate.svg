<text x="22" y="220" xml:space="preserve"><tspan fill="#fafafa" font-weight="700">  grav-blog  </tspan><tspan fill="#71717a">https://blog.example.com/mcp</tspan></text>
<text x="22" y="241" xml:space="preserve"><tspan fill="#67e8f9">  ❯ Authenticate</tspan><tspan fill="#71717a">   → opens the Grav login &amp; consent page in your browser</tspan></text>

<text x="22" y="283" xml:space="preserve"><tspan fill="#4ade80">  ✔ </tspan><tspan fill="#d4d4d8">Authentication successful. Connected to grav-blog (68 tools).</tspan></text>

